[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eugene-plexus-connector"
version = "0.2.0"
description = "Eugene Plexus connector: bridges external chat platforms (Discord, ...) to the orchestrator. First external sense organ."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Eugene Plexus contributors" },
]
keywords = ["eugene-plexus", "connector", "discord", "fastapi", "consciousness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "pyjwt>=2.9,<3",
    "httpx>=0.27,<1",
    "discord.py>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-pyyaml>=6,<7",
    "datamodel-code-generator>=0.26,<1",
]

[project.scripts]
eugene-plexus-connector = "eugene_plexus_connector.__main__:main"

[project.urls]
Homepage = "https://github.com/eugene-plexus"
Repository = "https://github.com/eugene-plexus/connector"
Issues = "https://github.com/eugene-plexus/connector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/eugene_plexus_connector"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "src/eugene_plexus_connector/_generated",
    ".codegen-cache",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# FastAPI uses Depends() / Query() / Body() in argument defaults — the
# framework's idiom for dependency injection. Allow in the dep module
# and in route modules that use Query().
"src/eugene_plexus_connector/dependencies.py" = ["B008"]
"src/eugene_plexus_connector/routes/adapters.py" = ["B008"]

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = [
    "src/eugene_plexus_connector/_generated/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "eugene_plexus_connector._generated.*"
ignore_errors = true

# discord.py ships type stubs but they're imperfect; allow a soft import.
[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
